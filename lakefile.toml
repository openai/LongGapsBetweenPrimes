name = "LongGapsBetweenPrimes"
version = "0.1.0"
defaultTargets = ["LongGapsBetweenPrimes"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[require]]
name = "Comparator"
git = "https://github.com/leanprover/comparator.git"
rev = "v4.33.0"

[[require]]
name = "lean4export"
scope = "leanprover"
git = "https://github.com/leanprover/lean4export"
rev = "v4.33.0"

[[lean_lib]]
name = "LongGapsBetweenPrimes"

[[lean_lib]]
name = "Challenge"
